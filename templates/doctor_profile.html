{% extends "base.html" %}

{% block title %}My Profile - HMS{% endblock %}

{% block sidebar %}
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('doctor_dashboard') }}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('doctor_appointments') }}">
                    <i class="fas fa-calendar-check"></i> My Appointments
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('doctor_patients') }}">
                    <i class="fas fa-users"></i> My Patients
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('doctor_availability') }}">
                    <i class="fas fa-clock"></i> Set Availability
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="{{ url_for('doctor_profile') }}">
                    <i class="fas fa-user"></i> My Profile
                </a>
            </li>
        </ul>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="fw-bold"><i class="fas fa-user-edit"></i> My Profile</h2>
    <p class="text-muted">Update your personal and professional information.</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('doctor_profile') }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ doctor.full_name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ doctor.email }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" value="{{ doctor.phone }}">
                </div>
                 <div class="col-md-6 mb-3">
                    <label for="department" class="form-label">Department</label>
                    <input type="text" class="form-control" id="department" value="{{ doctor.department.name }}" readonly>
                </div>
            </div>
            <div class="mb-3">
                <label for="qualification" class="form-label">Qualification</label>
                <textarea class="form-control" id="qualification" name="qualification" rows="3">{{ doctor.qualification }}</textarea>
            </div>
            <div class="mb-3">
                <label for="experience_years" class="form-label">Years of Experience</label>
                <input type="number" class="form-control" id="experience_years" name="experience_years" value="{{ doctor.experience_years }}">
            </div>
            <hr>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
