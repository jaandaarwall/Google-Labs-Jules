{% extends "base.html" %}

{% block title %}Login - Hospital Management System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-75 py-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-hospital-user fa-4x text-primary mb-3"></i>
                        <h3 class="fw-bold">Login to HMS</h3>
                        <p class="text-muted">Enter your credentials to access your account</p>
                    </div>

                    <form method="POST" action="{{ url_for('common.login') }}" novalidate>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Login As:</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="role" id="roleAdmin" value="admin" required>
                                <label class="btn btn-outline-primary" for="roleAdmin">
                                    <i class="fas fa-user-shield"></i> Admin
                                </label>

                                <input type="radio" class="btn-check" name="role" id="roleDoctor" value="doctor" required>
                                <label class="btn btn-outline-success" for="roleDoctor">
                                    <i class="fas fa-user-md"></i> Doctor
                                </label>

                                <input type="radio" class="btn-check" name="role" id="rolePatient" value="patient" required checked>
                                <label class="btn btn-outline-info" for="rolePatient">
                                    <i class="fas fa-user-injured"></i> Patient
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" 
                                       placeholder="Enter username or email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Enter password" required>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3">
                             <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="{{ url_for('common.forgot_password') }}" class="text-decoration-none">Forgot Password?</a>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-2">Don't have an account?</p>
                        <a href="{{ url_for('common.register') }}" class="btn btn-outline-primary">
                            <i class="fas fa-user-plus"></i> Register as Patient
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
