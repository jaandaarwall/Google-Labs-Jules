{% extends "base.html" %}

{% block title %}Forgot Password - HMS{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-3"><i class="fas fa-key text-warning"></i> Forgot Password</h3>
                    <p class="text-muted text-center mb-4">Enter your registered email address to receive a temporary password.</p>
                    
                    <form method="POST" action="{{ url_for('common.forgot_password') }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning text-white fw-bold">Send Password</button>
                            <a href="{{ url_for('common.login') }}" class="btn btn-outline-secondary">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
