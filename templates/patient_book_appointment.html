{% extends "base.html" %}

{% block title %}Book Appointment - Patient{% endblock %}

{% block sidebar %}
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('patient_dashboard') }}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('patient_find_doctors') }}">
                    <i class="fas fa-search"></i> Find Doctors
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('patient_my_appointments') }}">
                    <i class="fas fa-calendar-check"></i> My Appointments
                </a>
            </li>
        </ul>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="fw-bold"><i class="fas fa-calendar-plus"></i> Book Appointment</h2>
</div>

<div class="card">
    <div class="card-body">
        <h5 class="card-title">Book an appointment with {{ doctor.full_name }}</h5>
        <form method="POST" action="{{ url_for('patient_book_appointment', doctor_id=doctor.id) }}">
            <div class="mb-3">
                <label for="appointment_date" class="form-label">Date</label>
                <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
            </div>
            <div class="mb-3">
                <label for="appointment_time" class="form-label">Time</label>
                <input type="time" class="form-control" id="appointment_time" name="appointment_time" required>
            </div>
            <div class="mb-3">
                <label for="reason" class="form-label">Reason for Appointment</label>
                <textarea class="form-control" id="reason" name="reason" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Book Appointment</button>
        </form>
    </div>
</div>
{% endblock %}
